# ╔══════════════════════════════════════════════════════════════╗
# ║                    HotelDeVille - levels.yml                 ║
# ╚══════════════════════════════════════════════════════════════╝
# Le niveau 1 est donné à la construction. Ici : le coût pour ATTEINDRE chaque niveau (2 à 12).
#
# Chaque ressource = un slot dans le menu /hotel. Le joueur clique dessus pour la valider.
#
# Types de ressources :
#   ITEM     : item  (MATERIAL ou nexo:nom_item) + amount          -> pris dans l'inventaire du joueur
#   MONEY    : amount                                               -> retiré de la balance (Vault/Essentials)
#   XP       : amount (+ mode: LEVELS ou POINTS)                    -> retiré de l'expérience du joueur
#   PLAYTIME : amount en MINUTES de temps de jeu                    -> vérifié (non consommé par défaut)
#
# Options communes (toutes facultatives) :
#   slot: 20            -> force le slot (sinon ordre de menus.yml > main.requirement-slots)
#   material: DIAMOND   -> remplace l'icône (MATERIAL ou nexo:nom_item)
#   name: "&bTexte"     -> remplace le nom ({amount}, {have}, {display} disponibles)
#   lore: [ ... ]       -> remplace la description
#
# time : durée de l'amélioration une fois toutes les ressources validées.
#        Formats : 90 (secondes), 30s, 15m, 2h, 1d, 1d12h30m

